# Added to notes-bot.service when the local Bot API server is used.
# The server writes downloaded files as its own user with mode 0600. CAP_DAC_READ_SEARCH lets
# the bot read them (and nothing else: it cannot write or delete), so the sensitive
# paths below are hidden from it.
[Unit]
Requires=notes-bot-api.service
After=notes-bot-api.service

[Service]
AmbientCapabilities=CAP_DAC_READ_SEARCH
CapabilityBoundingSet=CAP_DAC_READ_SEARCH
NoNewPrivileges=yes
InaccessiblePaths=-/root -/home -/etc/shadow -/etc/gshadow -/etc/ssh -/etc/notes-bot
